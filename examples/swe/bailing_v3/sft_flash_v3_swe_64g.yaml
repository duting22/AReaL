experiment_name: flash-v3-swe-sft
trial_name: flash-v3-swe-256k

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 8
  n_gpus_per_node: 8
  fileroot: /tmp/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/name_resolve

# V3 flash has 32 attention heads, so heads_per_tp=8 and heads_per_cp=4.
allocation_mode: "megatron:(attn:d2p2t2c8|ffn:d4p2e8)"

scheduler:
  type: slurm

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  # BailingMoeV3 flash HF ckpt (q_lora_rank=null direct-Q). fla 0.4.2 shipped in areal-dev.sif.
  path: /storage/openpsi/models/ling-flashv3-wothink-base-midtrain/
  init_from_scratch: false
  gradient_checkpointing: true
  dtype: bfloat16
  grad_reduce_dtype: float32
  mb_spec:
    n_mbs: 1
    granularity: 1
    max_tokens_per_mb: 262144
    n_mbs_divisor: 1
  pad_to_maximum: false
  optimizer:
    type: adam
    lr: 1.5e-5
    weight_decay: 0.1
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
    min_loss_scale: 1.0
    loss_scale_window: 5.0
    hysteresis: 2
  megatron:
    wrap_with_ddp: true
    ddp:
      grad_reduce_in_fp32: true
      overlap_grad_reduce: true
      overlap_param_gather: false
      use_distributed_optimizer: true
    use_deterministic_algorithms: false
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    moe_router_dtype: fp32
    moe_router_bias_update_rate: 0.0
    moe_z_loss_coeff: 3.5e-6
    moe_token_dispatcher_type: alltoall
    use_precision_aware_optimizer: false
    main_grads_dtype: float32
    main_params_dtype: float32
    exp_avg_dtype: float32
    exp_avg_sq_dtype: float32
    optimizer_cpu_offload: false
    optimizer_offload_fraction: 1.0
    overlap_cpu_optimizer_d2h_h2d: true
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 32
      image: /storage/openpsi/images/areal-dev-sglang-20260429.sif
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        NCCL_DEBUG: "WARN"
        NCCL_ASYNC_ERROR_HANDLING: "1"
        PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
        HF_DATASETS_CACHE: "/storage/openpsi/users/chucai.dzq/.hf_cache"
      additional_bash_cmds:
        - export UV_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ && uv pip install -e .


# SWE-specific data processing.
swe:
  split_mode: trajectory
  filter_errors: true
  strip_all_thinking: false
  pre_split: false
  num_proc: 16
  filter_empty_tool_calls: false
  filter_bare_text_tool_calls: false
  truncate_task_notifications: false
  cleanup_processed_dataset: false
  parse_tool_call_args: true

train_dataset:
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  drop_last: true
  path: /storage/openpsi/users/shenxujie.sxj/datasets/swe_data/sft_test_dataset_filter_openai_all_last.jsonl
  type: sft
  max_length: 262144

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  retries: 3
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_secs: 3600
  no_save_optim: true
  no_load_optim: true

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
